<style>
/* Look: a night game. Turf-black panels under floodlights, and the two lines every broadcast draws on the field as the only bright colours: the first-down line (yellow) and the line of scrimmage (blue). Headings, menu and scores are slanted condensed type, like a game's own interface; each club brings its colours through its badge and the score bar. The whole page is one dark theme. */

.wrap { max-width: 1080px; margin-inline: auto; }

.brand { font-family: var(--display); font-weight: 800; font-style: italic; font-size: 30px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; display: flex; align-items: center; gap: 12px; }
.brand i { width: 24px; height: 24px; background: linear-gradient(135deg, #7CF0E6 0%, #19B8B0 48%, #0B7F86 100%); transform: rotate(45deg) scale(.82); display: inline-block; box-shadow: 0 0 14px rgba(25,184,176,.55); }
.search { position: relative; flex: 1 1 220px; max-width: 360px; margin-left: auto; min-width: 0; }

  <div class="search"><input id="q" type="search" placeholder="Find a player or club" autocomplete="off" aria-label="Find a player or club"><div class="results" id="res" hidden></div></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</header>
<main class="wrap" id="app"></main>
<footer id="foot"></footer>
<script id="data" type="application/json">__DATA__</script>
<script>__STAGE__</script>
<script>__STAGE3D__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const clubs = D.clubs, byId = {}, byAbbr = {};
clubs.forEach((c, i) => { c.index = i; c.did = Math.floor(i / 6); byId[c.id] = c; byAbbr[c.abbr] = c; });
const POSITIONS = [["Offense", ["QB", "RB", "WR", "TE", "OL"]], ["Defense", ["DL", "LB", "CB", "S"]], ["Special teams", ["K", "P"]]];
const POSNAME = { QB: "Quarterback", RB: "Running back", WR: "Wide receiver", TE: "Tight end", OL: "Offensive line", DL: "Defensive line", LB: "Linebacker", CB: "Cornerback", S: "Safety", K: "Kicker", P: "Punter" };
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"], DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const e = s => String(s == null ? "" : s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const dateOf = iso => new Date(iso + "T12:00:00");
const fmtDate = iso => { const d = dateOf(iso); return `${DOW[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtLong = iso => { const d = dateOf(iso); return `${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; };
const fmtShort = iso => { const d = dateOf(iso); return `${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtTime = t => { const [h, m] = t.split(":").map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, "0")} ${h < 12 ? "am" : "pm"}`; };
const lum = hex => { const n = parseInt(hex.slice(1), 16), f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }; return .2126 * f(n >> 16) + .7152 * f((n >> 8) & 255) + .0722 * f(n & 255); };
const pct = r => { const g = r.w + r.l + r.t; return g ? ((r.w + r.t / 2) / g).toFixed(3).replace(/^0/, "") : ".000"; };
const rec = r => r ? `${r.w}-${r.l}${r.t ? "-" + r.t : ""}` : "";
const badge = (c, size = "") => `<span class="badge ${size}" style="--p:${c.colors[0]};--s:${c.colors[1]};--t:${c.colors[2]};color:${lum(c.colors[0]) > .4 ? "#101418" : "#fff"}" aria-hidden="true">${e(c.abbr)}</span>`;
const clubLink = (c, extra = "") => `<a class="club" href="#club-${c.abbr}">${badge(c, "sm")}<span class="nm">${e(c.name)}</span>${extra}</a>`;
const stripe = c => `<div class="stripe" style="background:linear-gradient(90deg,${c.colors[0]} 0 52%,${c.colors[1]} 52% 82%,${c.colors[2]} 82% 100%)"></div>`;
const slotOf = g => { const wd = dateOf(g.date).getDay(); if (wd === 6) return ["Saturday night", 4]; if (wd === 1) return ["Monday night", 5]; const h = +g.time.split(":")[0]; return h < 12 ? ["Sunday morning", 1] : h < 15 ? ["Sunday afternoon", 2] : ["Sunday evening", 3]; };
const conf = i => D.conferences[i];
let seedOf = {}, seedNow = false;                          // seedNow: the seeds shown are those of "if the regular season ended now", worked out by the engine from the finals so far
const reseed = () => { seedOf = {}; seedNow = !Object.keys(D.seeds).length && !!D.seedsNow; Object.entries(seedNow ? D.seedsNow : D.seeds).forEach(([cf, ids]) => ids.forEach((id, k) => seedOf[id] = k + 1)); }; reseed();
clubs.forEach(c => { c.exiled0 = c.exiled; });             // who began in exile on Founding Day (a club's status changes year to year in a live league)
const players = [], playerById = {}, FOUND_BIO = {};
clubs.forEach(c => c.roster.forEach(p => { if (p.pid != null && p.bio) FOUND_BIO[p.pid] = p.bio; }));
const indexPlayers = () => { players.length = 0; for (const k in playerById) delete playerById[k]; clubs.forEach(c => c.roster.forEach((p, i) => { p.club = c; p.idx = i; players.push(p); if (p.pid != null) playerById[p.pid] = p; })); };
indexPlayers();
const playerHref = p => p.pid != null ? `#player-${p.pid}` : `#player-${p.club.abbr}-${p.idx}`;
/* The live league changes its people and rosters every year (the draft, free agency, retirements, hirings and firings): each year's schedule file carries the clubs as the year began (engine/site_export.snapshot),
   and the page shows the year being looked at from it. A page with no such snapshot (the founding season, an older feed) keeps the rosters it was built with. */
let TEAMS_FOR = null;
function applyTeams(S) {
  if (!S || !S.teams || S === TEAMS_FOR) return; TEAMS_FOR = S;
  const KEYS = ["ceo", "gm", "head_coach", "offensive_coordinator", "defensive_coordinator"];
  clubs.forEach(c => { const t = S.teams[c.id]; if (!t) return;
    c.people = {}; KEYS.forEach((k, i) => { const q = t.p[i]; c.people[k] = q ? { name: q[0], trait: q[1], hometown: q[2], age: q[3] } : null; });
    c.roster = t.r.map(r => ({ pid: r[0], name: r[1], pos: r[2], age: r[3], ovr: r[4], college: r[5], hometown: r[6], salary: r[7], years: r[8], trait: r[9], bio: r[10] || FOUND_BIO[r[0]] || "" })); });
  indexPlayers();
}
const winner = g => g.hp > g.ap ? g.home : g.ap > g.hp ? g.away : null;
const money = m => "$" + m.toFixed(2) + "M";
const G0 = D.games2000 || D.games;                         // the 2000 schedule, for the guide's time-slot table
const ptsOf = c => G0.filter(g => g.home === c.id || g.away === c.id).reduce((s, g) => s + slotOf(g)[1], 0);
const allPts = clubs.filter(c => !c.exiled0).map(ptsOf);
const rangeLo = Math.min(...allPts), rangeHi = Math.max(...allPts);

/* ---------- pages ---------- */
/* The standings columns beyond the record. Each is arithmetic on the games played so far, the same as the engine's tiebreak measures (strength of schedule and of victory count
   every game against an opponent once, an opponent's whole record counted, a tie as half a win); check_site.py compares them with the engine's own. */
function standExtras() {
  const X = {}; clubs.forEach(c => X[c.id] = { sched: 0, played: [] });
  D.games.forEach(g => { X[g.home].sched++; X[g.away].sched++; if (g.hp != null) { const w = g.hp > g.ap ? 1 : g.hp < g.ap ? 0 : .5; X[g.home].played.push([g.away, w]); X[g.away].played.push([g.home, 1 - w]); } });
  const sum = L => L.reduce((a, b) => a + b, 0), cr = id => sum(X[id].played.map(x => x[1])), nn = id => X[id].played.length;
  const R = (L, f) => { const w = L.filter(x => x[1] === 1).length, l = L.filter(x => x[1] === 0).length; return `${w}-${l}${L.length - w - l ? "-" + (L.length - w - l) : ""}`; };
  const P = (a, b) => b ? (a / b).toFixed(3).replace(/^0/, "") : "";
  clubs.forEach(c => { const x = X[c.id], pl = x.played, did = c.did, cf = Math.floor(did / 4);
    x.div = R(pl.filter(q => byId[q[0]].did === did)); x.conf = R(pl.filter(q => Math.floor(byId[q[0]].did / 4) === cf));
    x.sos = P(sum(pl.map(q => cr(q[0]))), sum(pl.map(q => nn(q[0]))));
    const beat = pl.filter(q => q[1] === 1); x.sov = pl.length ? (beat.length ? P(sum(beat.map(q => cr(q[0]))), sum(beat.map(q => nn(q[0])))) : ".000") : "";
    x.credit = cr(c.id); x.lossCredit = pl.length - x.credit; x.left = x.sched - pl.length; });
  return X;
}
function standings() {
  let h;
  if (D.champion == null) {
    h = `<div class="stack"><div class="champion" style="background:var(--soft);border-color:var(--line)"><div><div class="eyebrow">Season ${D.season}</div><h2>${e(phaseText())}</h2><p style="color:var(--muted)">${e(LIVE ? "Standings are what the games played so far add up to. Clubs are ordered by the league's own tiebreakers, and the numbered badges are the playoff seeds as they would stand if the regular season ended now; both change as games end." : "")}</p></div></div>
    <p class="note">A read-only window on the league. Everything here is the engine's own record; nothing on this page changes the league.</p>`;
  } else {
    const ch = byId[D.champion], final = D.playoffs[D.playoffs.length - 1];
    h = `<div class="stack"><div class="champion">${badge(ch, "lg")}<div><div class="eyebrow">Diamond Coronation · ${fmtLong(D.calendar.coronation)}</div><h2>${e(ch.name)}</h2>
    <p>Season ${D.season} champions, ${rec(ch.record)} in the regular season. Final: ${e(byId[D.champion].abbr)} ${D.champion === final.home ? final.hp : final.ap}, ${e(byId[D.champion === final.home ? final.away : final.home].abbr)} ${D.champion === final.home ? final.ap : final.hp}.</p></div></div>
    <p class="note">A read-only window on the league. ${LIVE ? "" : "This is the first season of the founding class, played by the engine on the autopilot with no agents yet. "}Numbers shown are the engine's own.</p>`;
  }
  const X = standExtras();
  D.conferences.forEach((cn, ci) => {
    h += `<section class="stack" style="padding-top:0"><h1 style="font-size:36px"><a href="#conference-${ci}">${e(cn)} Conference</a></h1><div class="grid stand">`;
    for (let di = 0; di < 4; di++) h += divBlock(ci * 4 + di, X);
    h += `</div></section>`;
  });
  return h + STAND_NOTE;
}
/* one division's table: the same columns wherever it is shown (the standings, a conference page, a division page) */
const STAND_NOTE = `<p class="note" style="margin-top:8px">The numbered badges are playoff seeds (seven clubs a conference qualify): during the season they are the seeds as they would stand if it ended now. GB is games behind the division leader. The leader shows its magic number, M: any mix of that many wins by the leader and losses by its closest rival clinches the division outright (a tie counts half). Div and Conf are records in division and conference games. SOS is the winning percentage of all opponents played, SOV of the opponents beaten; these are the league's tiebreakers after head-to-head, division record and common games, and they settle a tie only when the earlier ones do not.</p>`;
function divBlock(did, X, title = true) {
  const members = clubs.filter(c => c.did === did), order = D.division_ranks[did] || [], active = order.map(id => byId[id]), exiled = members.filter(c => c.exiled);
  let h = `<div class="stack" style="padding-top:0;gap:8px">${title ? `<h3><a href="#division-${did}">${e(members[0].division)}</a></h3>` : ""}<div class="tablewrap"><table><thead><tr><th>Club</th><th>W</th><th>L</th><th>T</th><th>Pct</th><th title="Games behind the division leader; the leader shows its magic number (M), the wins by the leader plus losses by the closest rival that clinch the division outright, ties counting half">GB / Magic</th><th title="Record in division games">Div</th><th class="hide-sm" title="Record in conference games">Conf</th><th class="hide-sm" title="Strength of schedule: the combined winning percentage of every opponent played">SOS</th><th class="hide-sm" title="Strength of victory: the combined winning percentage of the opponents beaten">SOV</th><th>Diff</th></tr></thead><tbody>`;
  const lead = active[0], others = active.slice(1), XL = lead && X[lead.id], done = active.every(c => X[c.id].left === 0);
  const magic = !lead ? "" : done ? `<b title="The division is decided">Won</b>` : (() => { const m = Math.ceil(XL.sched + .5 - XL.credit - Math.min(...others.map(c => X[c.id].lossCredit))); return m <= 0 ? `<b title="Clinched the division outright">Clinched</b>` : `<b title="Magic number: ${m} more wins by ${e(lead.name)} or losses by the closest rival clinch the division outright">M ${m}</b>`; })();
  active.forEach(c => { const r = c.record, d = r.pf - r.pa, sd = seedOf[c.id], x = X[c.id];
    const gb = c === lead ? magic : ((XL.credit - x.credit) + (x.lossCredit - XL.lossCredit)) / 2, gbs = typeof gb === "number" ? String(gb) : gb;
    h += `<tr><td>${clubLink(c, c.id === D.champion ? `<span class="seed gold" title="Champion">◆</span>` : sd ? `<span class="seed" title="${seedNow ? `Playoff seed ${sd} if the regular season ended now` : `Playoff seed ${sd}`}">${sd}</span>` : "")}</td><td>${r.w}</td><td>${r.l}</td><td>${r.t}</td><td>${pct(r)}</td><td>${gbs}</td><td>${x.div}</td><td class="hide-sm">${x.conf}</td><td class="hide-sm">${x.sos}</td><td class="hide-sm">${x.sov}</td><td>${d > 0 ? "+" : ""}${d}</td></tr>`; });
  exiled.forEach(c => { const a = c.ambassador; h += `<tr class="exile"><td>${clubLink(c)}</td><td colspan="10" style="text-align:left;white-space:normal">In exile this season · Ambassador Season ${a.w}-${a.l}${a.t ? "-" + a.t : ""}</td></tr>`; });
  return h + `</tbody></table></div></div>`;
}

function playoffs() {
  const names = { playoff_wc: ["Wild card", "wild_card"], playoff_div: ["Divisional round", "divisional"], playoff_conf: ["Conference championship", "conference"], playoff_final: ["Diamond Coronation", "coronation"] };
  const gm = (g) => { if (g.home == null) return `<div class="game" style="grid-template-columns:1fr"><span style="color:var(--muted)">Matchup set shortly before kickoff${g.start ? " · " + realTime(g.start) : ""}</span></div>`;
    const w = winner(g), played = g.hp != null; return `<div class="game" style="grid-template-columns:1fr"><div class="teams">${[g.away, g.home].map(id => `<div><span>${clubLink(byId[id])}</span><span class="sc ${played ? (w === id ? "won" : "lost") : ""}">${played ? (id === g.home ? g.hp : g.ap) : ""}</span></div>`).join("")}</div>${hasBox(g) ? `<a class="more" style="padding:0 14px 8px;display:block" href="#game-${g.id}">${g.live ? "Watch live" : "Box score and replay"}</a>` : ""}</div>`; };
  let h = `<div class="stack"><h1>Playoffs</h1><p class="note">Seven clubs a conference qualify. The Diamond Coronation is the league's championship game, played on the last Sunday of the year.</p><div class="grid">`;
  [0, 1].forEach(ci => {
    const six = D.playoffs.slice(ci * 6, ci * 6 + 6);
    h += `<div class="stack" style="padding-top:0;gap:12px"><h2>${e(conf(ci))}</h2><div class="tablewrap"><table><thead><tr><th>Seed</th><th class="l">Club</th><th>Record</th></tr></thead><tbody>${((D.seeds || {})[ci] || []).map((id, k) => `<tr><td>${k + 1}</td><td class="l">${clubLink(byId[id])}</td><td>${rec(byId[id].record)}</td></tr>`).join("")}</tbody></table></div>`;
    ["playoff_wc", "playoff_div", "playoff_conf"].forEach(k => { const gs = six.filter(g => g.kind === k); h += `<div class="tablewrap"><div class="day">${names[k][0]}<span>${fmtDate(D.calendar.playoff_dates[names[k][1]])}</span></div>${gs.map(gm).join("")}</div>`; });
    h += `</div>`;
  });
  const f = D.playoffs[12] || { kind: "playoff_final" };
  h += `</div><div class="tablewrap"><div class="day">Diamond Coronation<span>${fmtDate(D.calendar.playoff_dates.coronation)}</span></div>${gm(f)}</div></div>`;
  return h;
}

function gameRow(g, focus) {
  const w = winner(g), played = g.hp != null;
  const row = id => `<div><span>${clubLink(byId[id])}</span><span class="sc ${played ? (w === id ? "won" : w === null ? "" : "lost") : ""}">${played ? (id === g.home ? g.hp : g.ap) : ""}</span></div>`;
  return `<div class="game"><span class="t">${fmtTime(g.time)}${g.kind === "division" ? '<span class="tag">Division</span>' : g.kind === "nonconf" ? '<span class="tag">Interconf.</span>' : ""}${hasBox(g) ? `<a class="more" href="#game-${g.id}">${g.live ? "Live" : "Box score"}</a>` : ""}</span><div class="teams">${row(g.away)}${row(g.home)}</div></div>`;
}

function schedule(week) {
  week = Math.min(19, Math.max(1, week || 1));
  const games = D.games.filter(g => g.week === week), cal = D.calendar;
  let chips = "";
  for (let w = 1; w <= 19; w++) { chips += `<a class="chip" href="#schedule-${w}" ${w === week ? 'aria-current="true"' : ""}>${w}</a>`; if ([4, 9, 14].includes(w)) chips += `<span class="chip bye" title="League-wide bye">bye</span>`; }
  const byDate = {}; games.forEach(g => (byDate[g.date] = byDate[g.date] || []).push(g));
  const label = { 6: "Saturday night football", 0: "Sunday", 1: "Monday night football" };
  let h = `<div class="stack"><h1>Schedule</h1><div class="chips" role="navigation" aria-label="Weeks">${chips}</div><h2>Week ${week}</h2>`;
  Object.keys(byDate).sort().forEach(d => { const wd = dateOf(d).getDay(); h += `<div class="tablewrap"><div class="day">${label[wd]}<span>${fmtDate(d)}</span></div>${byDate[d].sort((a, b) => a.time.localeCompare(b.time) || a.game - b.game).map(g => gameRow(g)).join("")}</div>`; });
  if (week >= 15) { const playing = new Set(); games.forEach(g => { playing.add(g.home); playing.add(g.away); });
    const bye = clubs.filter(c => !c.exiled && !playing.has(c.id)); h += `<p class="note"><b>On bye:</b> ${bye.map(c => e(c.name)).join(", ")}.</p>`; }
  const amb = D.ambassador.filter(g => g.week === week);
  if (amb.length) h += `<div class="tablewrap"><div class="day">Ambassador Season<span>the clubs in exile · played this week</span></div>${amb.map(g => gameRow(Object.assign({ time: "12:00", kind: "" }, g))).join("").replace(/<span class="t">12:00 pm/g, `<span class="t">`)}</div>`;
  return h + `</div>`;
}

/* ---------- the hierarchy: home, the DFL (conferences, divisions, clubs), search, history and information ---------- */
const confOf = c => Math.floor(c.did / 4);
const divName = did => clubs.find(c => c.did === did).division;
const crumbs = L => `<nav class="crumbs" aria-label="You are here">${L.map(([href, t], i) => i < L.length - 1 ? `<a href="${href}">${e(t)}</a>` : `<span aria-current="page">${e(t)}</span>`).join('<span aria-hidden="true"> › </span>')}</nav>`;
const clubCrumbs = c => [["#dfl", "DFL"], ["#conference-" + confOf(c), conf(confOf(c)) + " Conference"], ["#division-" + c.did, c.division], [null, c.name]];
const standingOrder = did => (D.division_ranks[did] || []).map(id => byId[id]).concat(clubs.filter(c => c.did === did && c.exiled));

/* the DFL: the two conferences side by side, each division a block of its clubs in the order they stand; a division's name, a conference's name and every club are links */
function dflPage() {
  let h = `<div class="stack"><h1>The DFL</h1><p class="note">${e(phaseText())}. Pick a division to see its table, or a club to see its page.</p><div class="confs">`;
  D.conferences.forEach((cn, ci) => {
    h += `<section class="stack" style="padding-top:0;gap:14px"><h2><a href="#conference-${ci}">${e(cn)} Conference</a></h2>`;
    for (let di = 0; di < 4; di++) { const did = ci * 4 + di;
      h += `<div class="card"><h3><a href="#division-${did}">${e(divName(did))}</a></h3><div class="stack" style="gap:6px;padding-top:12px">${standingOrder(did).map((c, k) => `<a class="club" href="#club-${c.abbr}" style="justify-content:space-between;width:100%"><span class="club"><span class="eyebrow" style="width:1.4em;text-align:right">${c.exiled ? "" : k + 1}</span>${badge(c, "sm")}<span class="nm">${e(c.name)}</span>${!c.exiled && c.id === D.champion ? `<span class="seed gold" title="Champion">◆</span>` : !c.exiled && seedOf[c.id] ? `<span class="seed" title="Playoff seed ${seedOf[c.id]}">${seedOf[c.id]}</span>` : ""}</span><span class="tag">${c.exiled ? "exile" : rec(c.record)}</span></a>`).join("")}</div></div>`; }
    h += `</section>`; });
  return h + `</div><p class="note">Forty-eight clubs in eight divisions; one club in each division is in exile each season. <a href="#standings">All the standings on one page</a> · <a href="#playoffs">Playoffs</a>.</p></div>`;
}
function conferencePage(ci) {
  if (!D.conferences[ci]) return notFound();
  const X = standExtras();
  let h = `<div class="stack">${crumbs([["#dfl", "DFL"], [null, conf(ci) + " Conference"]])}<h1>${e(conf(ci))} Conference</h1><div class="grid stand">`;
  for (let di = 0; di < 4; di++) h += divBlock(ci * 4 + di, X);
  return h + `</div>${STAND_NOTE}</div>`;
}
function divisionPage(did) {
  if (!(did >= 0 && did < 8)) return notFound();
  const ci = Math.floor(did / 4), X = standExtras();
  return `<div class="stack">${crumbs([["#dfl", "DFL"], ["#conference-" + ci, conf(ci) + " Conference"], [null, divName(did)]])}<h1>${e(divName(did))}</h1><p style="color:var(--muted)">${e(conf(ci))} Conference · ${e(phaseText())}</p>${divBlock(did, X, false)}${STAND_NOTE}</div>`;
}

/* home: where the page opens. Plain on purpose: the state of the league, what is on, who leads each division, and the way to everything else */
function homePage() {
  const R = LIVE ? FEED.results : null, sd = LIVE ? simDate() : null;
  const all = [...D.games, ...D.ambassador, ...D.playoffs.filter(g => g.home != null)].filter(g => g.id);
  const fin = all.filter(g => g.final || (!LIVE && g.hp != null)), live = LIVE ? all.filter(g => g.live) : [], next = LIVE ? all.filter(g => !g.final && !g.live).sort((a, b) => a.start - b.start).slice(0, 3) : [];
  const latest = LIVE ? fin.sort((a, b) => b.start - a.start).slice(0, 5) : D.playoffs.filter(g => g.hp != null).reverse().concat(D.games.filter(g => g.hp != null).sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time))).slice(0, 5);
  const line = (g, mid) => `<a class="gamelink" href="#game-${g.id}"><div class="game" style="grid-template-columns:150px 1fr"><span class="t">${mid}<span class="tag">${e(g.kind && g.kind.startsWith("playoff") ? stageName(g) : g.kind === "ambassador" ? "Ambassador" : "Week " + g.week)}</span></span><div class="teams">${[g.away, g.home].map(id => `<div><span class="club">${badge(byId[id], "sm")}<span class="nm">${e(byId[id].name)}</span></span>${g.hp != null || g.live ? `<span class="sc ${g.final && winner(g) === id ? "won" : g.final ? "lost" : ""}">${g.live ? R.now[g.id][id === g.home ? 0 : 1] : id === g.home ? g.hp : g.ap}</span>` : ""}</div>`).join("")}</div></div></a>`;
  const ch = D.champion != null ? byId[D.champion] : null;

/* the club's numbers, from its box scores (loaded as the stats page loads them, and kept): its own per-game figures, with the league rank once every game of the season is in */
async function clubExtras(c) {
  if (c.exiled) { const el = document.getElementById("cstat"); if (el) el.parentElement.style.display = "none"; return; }
  const run = ++STATS.run, $ = x => document.getElementById(x), reg = statGames("reg"), mine = reg.filter(g => g.home === c.id || g.away === c.id);
  const draw = () => {
    if (run !== STATS.run || !$("cstat")) return;
    const rs = mine.map(g => STATS.cache[g.id]).filter(Boolean);
    $("cprog").textContent = !mine.length ? "No game has been played yet." : rs.length < mine.length ? `${rs.length} of ${mine.length} games counted…` : `${rs.length} games counted.`;
    if (!rs.length) return;
    const all = reg.map(g => STATS.cache[g.id]).filter(Boolean), full = all.length === reg.length;
    const tbl = (view, title) => {
      const rows = teamRows(full ? all : rs, view), me = rows.find(x => x.id === c.id); if (!me) return "";
      const cols = TEAM_COLS[view].filter(k => k[0] !== "gp" && (STATS.v2 || (k[0] !== "pen" && k[0] !== "peny")));
      const rank = k => { const low = k[5]; return full ? `<td style="color:var(--muted)">${nth(1 + rows.filter(x => low ? x[k[0]] < me[k[0]] : x[k[0]] > me[k[0]]).length)}</td>` : "<td></td>"; };
      const fmt = (k, v) => k[0] === "top" ? Math.floor(v / 60) + ":" + String(Math.round(v % 60)).padStart(2, "0") : k[2] === 0 ? String(Math.round(v * 10) / 10) : v.toFixed(k[2]);
      return `<div class="tablewrap"><table><thead><tr><th class="l">${title}</th><th>Per game</th><th title="${full ? "Rank among the clubs that played" : "Open Team statistics to compare with the league"}">${full ? "Rank" : ""}</th></tr></thead><tbody>${cols.map(k => `<tr><td class="l" title="${e(k[3])}">${e(k[3].replace(/ \(.*\)/, ""))}</td><td>${fmt(k, me[k[0]])}</td>${rank(k)}</tr>`).join("")}</tbody></table></div>`;
    };
    $("cstat").innerHTML = tbl("off", "Offense") + tbl("def", "Defense");
    // each player's season line, found by her id in the box scores
    const cells = [...document.querySelectorAll("[data-pl]")]; if (!cells.length) return;
    const byCat = {}; for (const cat of ["pass", "rush", "recv", "def", "kick"]) { byCat[cat] = {}; playerRows(rs, cat, id => id === c.id).forEach(x => { byCat[cat][x.id] = x; }); }
    cells.forEach(td => { const cat = LINE_CAT[td.dataset.pos]; td.textContent = cat && td.dataset.pl ? lineText(cat, byCat[cat]["p" + td.dataset.pl]) : ""; });
  };
  draw();
  try { await statsLoad(mine, run, draw); } catch (err) { if (run === STATS.run && $("cprog")) $("cprog").textContent = "Some games could not be loaded: " + err; }
  draw();
  if (!LIVE && run === STATS.run) { try { await statsLoad(reg, run, () => {}); } catch (err) {} draw(); }       // the founding season is all in the page: rank the club against the league too (the live page fetches only this club's games; open Team statistics there to compare)
}

async function playerSeason(p) {

function guide() {
  const wk1 = G0.filter(g => g.week === 1), slotCount = {};
  wk1.forEach(g => { const n = slotOf(g)[0]; slotCount[n] = (slotCount[n] || 0) + 1; });
  const byPts = {}; clubs.filter(c => !c.exiled0).forEach(c => { const p = ptsOf(c); (byPts[p] = byPts[p] || []).push(c); });
  const divName = n => { const c = clubs[(n - 1) * 6]; return `${c.conference.slice(0, 1)}: ${c.division}`; };
  const L = ["A", "B", "C", "D", "E", "F", "G", "H"];
  const rows = D.evolution.map(y => `<tr><td>${y.year}${y.swapped ? ' <span class="tag" title="Conferences swapped this season">swap</span>' : ""}</td><td>${fmtShort(y.opener)}</td><td>${fmtShort(y.coronation)}</td><td>${y.offseason_days}</td>${y.slots.map(n => `<td>${n}</td>`).join("")}</tr>`).join("");
  return `<div class="stack"><h1>How the schedule works</h1>
  <p>The schedule is a fixed layout of games between <b>slots</b>, not between named clubs. A slot is a conference, a division and a seed from 1 to 5. Each season the clubs take their seats in the slots, and the same layout is played again. It was built once and it repeats without end.</p>
  <h2>The shape of a season</h2>
  <div class="card"><dl class="kv"><dt>Length</dt><dd>19 weeks, 18 games, one bye for each club in weeks 15 to 19. Nine games at home and nine away. A league-wide bye follows weeks 4, 9 and 14.</dd>
  <dt>Weeks 1 to 4</dt><dd>Four interconference games: a club meets the club with its own seed in each of the four divisions of the other conference.</dd>
  <dt>Weeks 5 to 14</dt><dd>Four division games, and six games against the other three divisions of its own conference, chosen by seed: seed 1 meets seeds 1 and 2, seed 2 meets 1 and 3, seed 3 meets 2 and 4, seed 4 meets 3 and 5, seed 5 meets 4 and 5.</dd>
  <dt>Weeks 15 to 19</dt><dd>The second round of division games. Every club plays each division rival twice, once at each ground.</dd></dl></div>
  <h2>Seeds</h2>
  <p>The first seeds, in 2000, were drawn by chance. After that a club's seed is its final place in its division the season before: first place is seed 1, and so on up to fourth place as seed 4. The fifth-place club goes into exile for a season, and a club coming back from exile takes seed 5. So the schedule follows last season's results, and the strongest clubs meet each other more often.</p>
  <h2>The rotation</h2>
  <p>Each division is also given a seat in the layout, and the seats rotate. In 2000 the layout's first division is each conference's first division. In 2001 the fourth division moves into that seat and the others move up one, so over four seasons every division sits in every seat. The rotation stays inside the conference, because the schedule's core is built there. In the fifth season the conferences swap, and the next full turn swaps them back, so the whole pattern repeats every eight years. Division games are always between clubs of the same division.</p>
  <h2>Time slots</h2>
  <p>Every kickoff is worth points, so that no club is given better times than the others: Monday night 5, Saturday night 4, Sunday evening 3, Sunday afternoon 2 and Sunday morning 1. A full week has ${Object.entries(slotCount).map(([k, v]) => `${v} on ${k.toLowerCase()}`).join(", ")}.</p>
  <p>In 2000 every playing club finished between ${rangeLo} and ${rangeHi} points:</p>
  <div class="tablewrap"><table><thead><tr><th class="l">Points</th><th class="l">Clubs</th></tr></thead><tbody>${Object.keys(byPts).sort((a, b) => b - a).map(p => `<tr><td class="l">${p}</td><td class="l" style="white-space:normal">${byPts[p].map(c => `<a href="#club-${c.abbr}" style="text-decoration:underline;text-decoration-color:var(--line)">${e(c.abbr)}</a>`).join(", ")}</td></tr>`).join("")}</tbody></table></div>
  <p>The rotation is what keeps this level over time. A club holding the same seed ends any four seasons within one point of the same seed in any other division, and exactly level after eight. What is left is the seed itself, about a point a season between the best and the worst seats, and that follows the standings.</p>
  <h2>Forty seasons</h2>
  <p>The calendar moves with the year, since the Diamond Coronation is the last Sunday of December and the first game is 183 days before it. The numbers on the right show which division fills each of the eight seats, A to H, in each season: seats A to D belong to one conference's divisions and E to H to the other's.</p>
  <div class="tablewrap"><table><thead><tr><th class="l">Season</th><th>First game</th><th>Coronation</th><th>Offseason days</th>${L.map(x => `<th>${x}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
  <div class="card"><div class="eyebrow">Divisions</div><div class="grid tight" style="margin-top:8px">${[1, 2, 3, 4, 5, 6, 7, 8].map(n => `<div><b>${n}</b> &nbsp;${e(divName(n))}</div>`).join("")}</div></div></div>`;
}

    + shown.map((r, i) => `<tr><td style="color:var(--muted)">${i + 1}</td>${first[1](r)}${cols.map(c => `<td${c[4] ? ' class="hide-sm"' : ""}>${fmt(c, r)}</td>`).join("")}</tr>`).join("") + `</tbody></table></div>` + (rows.length > limit ? `<p class="note">Showing the top ${limit} of ${rows.length}.</p>` : "");

/* the columns on show: every column of the view, or the ones of the group chosen */
function statCols(kind) {
  const U = STATS.ui;
  if (kind === "player") return PLAYER_COLS[U.cat];
  const all = TEAM_COLS[U.off].filter(c => STATS.v2 || (c[0] !== "pen" && c[0] !== "peny")), groups = TEAM_GROUPS[U.off].filter(g => g[1].some(k => all.find(c => c[0] === k && k !== "gp"))), gi = U.grp[U.off];
  const g = gi === "all" ? null : groups.find(x => x[0] === gi) || groups[0];
  return g ? all.filter(c => g[1].includes(c[0])) : all;
}
const defaultSort = (kind, U) => kind === "team" ? (U.off === "off" ? { key: "ppg", dir: 1 } : { key: "papg", dir: -1 }) : { key: PLAYER_DEFAULT[U.cat], dir: 1 };
function statsPage(kind) {
  if (kind !== "team" && kind !== "player") return `<div class="stack"><h1>Statistics</h1><p class="note">Every finished game of the season, added up as the games are played. Click a column heading, or use "Sort by", to put the clubs or players in a different order.</p><div class="grid">
    <a class="card fork" href="#stats-team"><h3>Team statistics</h3><p>Offense and defense for every club, in groups (scoring, passing and rushing, situations${LIVE || STATS.v2 ? ", discipline" : ""}), for the league, a conference or a division.</p></a>
    <a class="card fork" href="#stats-player"><h3>Player statistics</h3><p>Passing, rushing, receiving, defense and kicking leaders, sortable, for the league, a conference, a division or one club.</p></a></div></div>`;
  const U = STATS.ui, chip = (href, label, on) => `<a class="chip" href="${href}" ${on ? 'aria-current="true"' : ""}>${label}</a>`;
  const groups = kind === "team" ? [...TEAM_GROUPS[U.off].map(g => g[0]), "All"] : [], gcur = kind === "team" ? (U.grp[U.off] === "all" ? "All" : (TEAM_GROUPS[U.off].find(g => g[0] === U.grp[U.off]) || TEAM_GROUPS[U.off][0])[0]) : "";
  const view = kind === "team" ? `<div class="chips" role="group" aria-label="View"><button class="chip" data-off="off" ${U.off === "off" ? 'aria-current="true"' : ""}>Offense</button><button class="chip" data-off="def" ${U.off === "def" ? 'aria-current="true"' : ""}>Defense</button></div>`
    : `<div class="chips" role="group" aria-label="Category">${PLAYER_CATS.map(([k, n]) => `<button class="chip" data-cat="${k}" ${U.cat === k ? 'aria-current="true"' : ""}>${n}</button>`).join("")}</div>`;
  const grp = kind === "team" ? `<div class="chips" role="group" aria-label="Group of statistics">${groups.map(g => `<button class="chip" data-grp="${e(g)}" ${g === gcur ? 'aria-current="true"' : ""}>${e(g)}</button>`).join("")}</div>` : "";
  const scopes = `<select id="ssc" aria-label="Games">${SCOPES.map(([k, n]) => `<option value="${k}" ${U.scope === k ? "selected" : ""}>${n}</option>`).join("")}</select>`;
  const where = `<select id="swh" aria-label="Which clubs">${whereOpts(U.where, kind === "player")}</select>`;
  setTimeout(() => statsRun(kind), 0);

    <h1>${kind === "team" ? "Team statistics" : "Player statistics"}</h1><div class="row">${view}${scopes}${where}</div>${grp ? `<div class="row">${grp}</div>` : ""}<div class="row" id="sctl"></div><p class="note" id="sprog"></p><div id="sbody"></div></div>`;
}
async function statsRun(kind) {
  const run = ++STATS.run, $ = x => document.getElementById(x), U = STATS.ui;
  const curSort = () => { const key = kind === "team" ? "t" + U.off : "p" + U.cat, cols = statCols(kind), cur = U.sort[key] || defaultSort(kind, U); return { key, cols, cur: cols.some(c => c[0] === cur.key) ? cur : { key: cols[0][0] === "gp" && cols[1] ? cols[1][0] : cols[0][0], dir: 1 } }; };
  const setSort = (k, dir) => { const { key, cols } = curSort(), c = cols.find(x => x[0] === k); U.sort[key] = { key: k, dir: dir || (c && c[5] ? -1 : 1) }; };
  const draw = () => {
    if (run !== STATS.run || !$("sbody")) return;
    const games = statGames(U.scope), rs = games.map(g => STATS.cache[g.id]).filter(Boolean), ok = whereTest(U.where);
    $("sprog").textContent = rs.length ? `${rs.length} finished game${rs.length === 1 ? "" : "s"} counted${rs.length < games.length ? `, ${games.length - rs.length} more loading` : ""}.` : (games.length ? "Loading the games…" : "No game in this group has finished yet.");

    const { cols, cur } = curSort(), sorts = cols.filter(c => c[0] !== "gp");
    // "Sort by": the same ordering as clicking a heading, said in words
    $("sctl").innerHTML = `<label class="eyebrow">Sort by <select id="ssort">${sorts.map(c => `<option value="${c[0]}" ${c[0] === cur.key ? "selected" : ""}>${e(c[1])} · ${e(c[3])}</option>`).join("")}</select></label><button class="btn" id="sdir" type="button" title="Reverse the order">${cur.dir > 0 ? "Highest first" : "Lowest first"}</button>`;
    $("ssort").onchange = ev => { setSort(ev.target.value); draw(); }; $("sdir").onclick = () => { U.sort[curSort().key] = { key: cur.key, dir: -cur.dir }; draw(); };
    if (kind === "team") $("sbody").innerHTML = statTable(cols, teamRows(rs, U.off).filter(r => ok(r.id)), cur, [`<th class="l">Club</th>`, r => `<td class="l">${clubLink(byId[r.id])}</td>`], 100);
    else $("sbody").innerHTML = statTable(cols, playerRows(rs, U.cat, ok), cur, [`<th class="l">Player</th><th class="l">Club</th><th class="l">Pos</th>`, r => `<td class="l"><b>${e(r.name)}</b></td><td class="l">${clubLink(byId[r.club])}</td><td class="l">${e(r.pos)}</td>`], 100);
  };
  const redo = () => { render(false); };
  const on = (sel, fn) => document.querySelectorAll(sel).forEach(el => el.addEventListener(el.tagName === "SELECT" ? "change" : "click", () => fn(el)));
  on("[data-off]", el => { U.off = el.dataset.off; redo(); });
  on("[data-cat]", el => { U.cat = el.dataset.cat; redo(); });
  on("[data-grp]", el => { U.grp[U.off] = el.dataset.grp === "All" ? "all" : el.dataset.grp; redo(); });
  on("#ssc", el => { U.scope = el.value; redo(); });
  on("#swh", el => { U.where = el.value; redo(); });
  const body = $("sbody"); if (!body) return;
  body.addEventListener("click", ev => {
    const th = ev.target.closest("[data-sort]"); if (!th) return;
    const { cur } = curSort(), k = th.dataset.sort; if (k === "gp") return;
    if (cur.key === k) U.sort[curSort().key] = { key: k, dir: -cur.dir }; else setSort(k); draw();
  });
  draw();
  try { await statsLoad(statGames(U.scope), run, draw); } catch (err) { if (run === STATS.run && $("sprog")) $("sprog").textContent = "Some games could not be loaded: " + err; }
  draw();
}

/* ---------- router, tabs, search ---------- */
const TABS = [["dfl", "DFL"]].concat(LIVE ? [["live", "Live"]] : []).concat([["standings", "Standings"], ["schedule", "Schedule"], ["playoffs", "Playoffs"], ["stats", "Statistics"], ["search", "Search"], ["info", "History and Information"]]);
const SECTION = { club: "dfl", clubs: "dfl", player: "dfl", players: "search", standings: "standings", conference: "dfl", division: "dfl", game: "schedule", guide: "info", seasons: "info", founding: "info", calendar: "info", home: "" };

  const html = page === "home" ? homePage() : page === "dfl" || page === "clubs" ? dflPage() : page === "conference" ? conferencePage(+parts[1]) : page === "division" ? divisionPage(+parts[1]) : page === "search" || page === "players" ? (page === "players" && (SRCH.type = "player"), searchPage()) : page === "info" ? infoPage()
    : page === "live" ? livePage() : page === "standings" ? standings() : page === "schedule" ? schedule(+parts[1] || (LIVE ? curWeek() : 1)) : page === "guide" ? guide() : page === "playoffs" ? playoffs() : page === "club" ? club(parts[1])
    : page === "game" ? game(parts[1]) : page === "player" ? player(parts[1], parts[2]) : page === "stats" ? statsPage(parts[1]) : page === "seasons" ? seasonsPage(parts[1]) : page === "founding" ? founding() : page === "calendar" ? calendarPage() : notFound();
  if (REPLAY) { REPLAY.stop(); if (REPLAY.destroy) REPLAY.destroy(); REPLAY = null; }
  const banner = LIVE && FEED.view && page !== "seasons" ? `<div class="stack" style="padding-bottom:0"><p class="note" style="margin:0"><b>You are looking back at season ${e(D.season)}, a finished season.</b> <a href="#seasons">All seasons</a> · <a href="#live" data-live="1">Back to live</a></p></div>` : "";
  document.getElementById("app").innerHTML = banner + html;

  if (scroll) window.scrollTo(0, 0);
}
